name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d /home/deploy/app/.git ]; then
                git clone https://github.com/abd-mjahdi/Employee-HR-Management-System.git /home/deploy/app
            fi
            
            cd /home/deploy/app
            git pull origin main

            # Create production environment file
            cat > .env << EOF
            POSTGRES_DB=employee_hr
            POSTGRES_USER=hr
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=5432
            BACKEND_PORT=8080
            FRONTEND_PORT=4200
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            BOOTSTRAP_KEY=
            LIQUIBASE_CONTEXTS=prod
            TENANT_DEV_DEFAULT_SLUG=
            EOF

            # Deploy
            docker compose up --build -d
