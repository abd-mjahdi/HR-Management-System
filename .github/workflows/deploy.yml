name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d /home/deploy/app/.git ]; then
              git clone https://github.com/abd-mjahdi/Employee-HR-Management-System.git /home/deploy/app
            fi
            cd /home/deploy/app
            git pull origin main
            cat > .env <<EOF
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SPRING_PROFILES_ACTIVE=prod
            TENANT_BASE_DOMAIN=workline.casa
            TENANT_TRUST_FORWARDED_HOST=true
            FRONTEND_TENANT_URL_TEMPLATE=http://{slug}.workline.casa
            LIQUIBASE_CONTEXTS=prod,seed
            EOF
            docker compose up --build -d --remove-orphans
