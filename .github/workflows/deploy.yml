name: Deploy

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d /home/deploy/app/.git ]; then
              git clone https://github.com/abd-mjahdi/Employee-HR-Management-System.git /home/deploy/app
            fi
            cd /home/deploy/app
            git pull origin main
            cat > .env <<EOF
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SPRING_PROFILES_ACTIVE=prod
            TENANT_BASE_DOMAIN=workline.casa
            TENANT_TRUST_FORWARDED_HOST=true
            FRONTEND_TENANT_URL_TEMPLATE=http://{slug}.workline.casa
            LIQUIBASE_CONTEXTS=prod,seed
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            EOF
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans