name: hr-system-dev

services:
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ghcr.io/abd-mjahdi/hr-backend:${IMAGE_TAG:-latest}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_KEY: ${BOOTSTRAP_KEY:-}
      SPRING_LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-seed}
      TENANT_DEV_DEFAULT_SLUG: ${TENANT_DEV_DEFAULT_SLUG:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-workline.casa}
      TENANT_TRUST_FORWARDED_HOST: ${TENANT_TRUST_FORWARDED_HOST:-false}
      FRONTEND_TENANT_URL_TEMPLATE: ${FRONTEND_TENANT_URL_TEMPLATE:-http://{slug}.localhost:4200}
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: ghcr.io/abd-mjahdi/hr-frontend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
